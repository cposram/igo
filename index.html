firebase.initializeApp(CONFIG.firebase);

const topScores = { easy: [], medium: [], hard: [] };

<script>
// --- [1] 監聽排行榜 ---
function listenRank(lv) {
    const limit = (lv === 'hard') ? 6 : 3;
    db.ref(paths[lv]).orderByChild('steps').limitToFirst(limit).on('value', snap => {
        const listEl = document.getElementById(`rank-${lv}`);
        topScores[lv] = [];
        let html = "";
        if (snap.exists()) {
            snap.forEach(c => {
                const d = c.val(); topScores[lv].push(d);
                html += `<div class="rank-unit"><span class="name">${d.name}</span><span class="steps">${d.steps}步</span></div>`;
            });
            listEl.innerHTML = html;
        } else { listEl.innerHTML = "<span style='color:#777; font-size:9px;'>虛位以待</span>"; }
    });
}
['easy', 'medium', 'hard'].forEach(listenRank);

// --- [2] 遊戲狀態變數 ---
let board = []; 
let steps = 0, isGameOver = false, difficulty = 'easy', frameCount = 0;
let cellSize = 0, margin = 0, pieceRadius = 0;
let passCount = 0;
let koPoint = null;

const boardCanvas = document.getElementById('board-canvas');
const boardCtx = boardCanvas.getContext('2d');
const victoryCanvas = document.getElementById('victoryCanvas');
const victoryCtx = victoryCanvas.getContext('2d');
const diffLabels = { easy: '初段棋士', medium: '職業高段', hard: '🎖️ 覺醒小麥' };

function startGame(lv) {
    difficulty = lv;
    document.getElementById('setup-menu').style.display = 'none';
    document.getElementById('game-container').style.display = 'block';
    document.getElementById('display-lv').innerText = diffLabels[lv];
    
    resizeBoard();
    initBoard();
    requestAnimationFrame(animationLoop);
}

function resizeBoard() {
    const screenWidth = window.innerWidth;
    const baseSize = screenWidth < 600 ? 340 : 450;
    boardCanvas.width = baseSize; boardCanvas.height = baseSize;
    margin = baseSize / 10;
    cellSize = (baseSize - margin * 2) / (CONFIG.BOARD_SIZE - 1);
    pieceRadius = cellSize * 0.45;
    victoryCanvas.width = baseSize; victoryCanvas.height = baseSize;
}

function initBoard() {
    board = Array(CONFIG.BOARD_SIZE).fill().map(() => Array(CONFIG.BOARD_SIZE).fill(0));
    drawBoard();
    updateLiveArea();
    boardCanvas.onclick = handleCanvasClick;
}

function drawBoard() {
    boardCtx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);
    boardCtx.strokeStyle = "#4e3626"; boardCtx.lineWidth = 1.5;

    for (let i = 0; i < CONFIG.BOARD_SIZE; i++) {
        boardCtx.beginPath(); boardCtx.moveTo(margin, margin + i * cellSize); boardCtx.lineTo(boardCanvas.width - margin, margin + i * cellSize); boardCtx.stroke();
        boardCtx.beginPath(); boardCtx.moveTo(margin + i * cellSize, margin); boardCtx.lineTo(margin + i * cellSize, boardCanvas.height - margin); boardCtx.stroke();
    }
    const centerIdx = Math.floor(CONFIG.BOARD_SIZE / 2);
    boardCtx.beginPath(); boardCtx.arc(margin + centerIdx * cellSize, margin + centerIdx * cellSize, 4, 0, Math.PI * 2); boardCtx.fillStyle = "#4e3626"; boardCtx.fill();

    for (let r = 0; r < CONFIG.BOARD_SIZE; r++) {
        for (let c = 0; c < CONFIG.BOARD_SIZE; c++) {
            if (board[r][c] !== 0) {
                const px = margin + c * cellSize, py = margin + r * cellSize;
                boardCtx.beginPath(); boardCtx.arc(px, py, pieceRadius, 0, Math.PI * 2);
                let grad = boardCtx.createRadialGradient(px - pieceRadius*0.3, py - pieceRadius*0.3, pieceRadius*0.1, px, py, pieceRadius);
                if (board[r][c] === 1) { grad.addColorStop(0, '#555'); grad.addColorStop(1, '#000'); } 
                else { grad.addColorStop(0, '#fff'); grad.addColorStop(1, '#ccc'); }
                boardCtx.fillStyle = grad; boardCtx.fill();
                boardCtx.strokeStyle = board[r][c] === 1 ? "#000" : "#999"; boardCtx.lineWidth = 1; boardCtx.stroke();
            }
        }
    }
}

// --- [3] 領地與規則引擎 ---
function calculateArea(currentBoard) {
    let blackArea = 0, whiteArea = 0;
    let visited = Array(CONFIG.BOARD_SIZE).fill().map(() => Array(CONFIG.BOARD_SIZE).fill(false));

    for (let r = 0; r < CONFIG.BOARD_SIZE; r++) {
        for (let c = 0; c < CONFIG.BOARD_SIZE; c++) {
            if (currentBoard[r][c] === 1) blackArea++;
            else if (currentBoard[r][c] === 2) whiteArea++;
            else if (currentBoard[r][c] === 0 && !visited[r][c]) {
                let queue = [{r, c}];
                visited[r][c] = true;
                let touchesBlack = false, touchesWhite = false;
                let emptySpaces = 0, head = 0;

                while (head < queue.length) {
                    let curr = queue[head++];
                    emptySpaces++;
                    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
                    for(let d of dirs) {
                        let nr = curr.r + d[0], nc = curr.c + d[1];
                        if (nr >= 0 && nr < CONFIG.BOARD_SIZE && nc >= 0 && nc < CONFIG.BOARD_SIZE) {
                            if (currentBoard[nr][nc] === 1) touchesBlack = true;
                            if (currentBoard[nr][nc] === 2) touchesWhite = true;
                            if (currentBoard[nr][nc] === 0 && !visited[nr][nc]) {
                                visited[nr][nc] = true;
                                queue.push({r: nr, c: nc});
                            }
                        }
                    }
                }
                if (touchesBlack && !touchesWhite) blackArea += emptySpaces;
                if (touchesWhite && !touchesBlack) whiteArea += emptySpaces;
            }
        }
    }
    return { black: blackArea, white: whiteArea };
}

function updateLiveArea() {
    let area = calculateArea(board);
    document.getElementById('black-area').innerText = area.black;
    document.getElementById('white-area').innerText = area.white;
    return area;
}

function getNeighbors(r, c) {
    const list = [];
    if (r > 0) list.push({r: r - 1, c: c});
    if (r < CONFIG.BOARD_SIZE - 1) list.push({r: r + 1, c: c});
    if (c > 0) list.push({r: r, c: c - 1});
    if (c < CONFIG.BOARD_SIZE - 1) list.push({r: r, c: c + 1});
    return list;
}

function getGroupLiberties(currentBoard, r, c, color, visited) {
    let liberties = 0;
    const key = `${r},${c}`;
    if (visited.has(key)) return 0;
    visited.add(key);
    
    const neighbors = getNeighbors(r, c);
    for (let n of neighbors) {
        if (currentBoard[n.r][n.c] === 0) liberties++;
        else if (currentBoard[n.r][n.c] === color) {
            liberties += getGroupLiberties(currentBoard, n.r, n.c, color, visited);
        }
    }
    return liberties;
}

function executeCapture(currentBoard, targetColor) {
    let capturedList = [];
    const globalVisited = new Set();
    for (let r = 0; r < CONFIG.BOARD_SIZE; r++) {
        for (let c = 0; c < CONFIG.BOARD_SIZE; c++) {
            if (currentBoard[r][c] === targetColor && !globalVisited.has(`${r},${c}`)) {
                const block = new Set();
                let libs = getGroupLiberties(currentBoard, r, c, targetColor, block);
                if (libs === 0) {
                    block.forEach(pos => {
                        const [br, bc] = pos.split(',').map(Number);
                        currentBoard[br][bc] = 0;
                        capturedList.push({r: br, c: bc});
                    });
                }
                block.forEach(pos => globalVisited.add(pos));
            }
        }
    }
    return capturedList;
}

function isValidMove(currentBoard, r, c, color, currentKoPoint) {
    if (currentBoard[r][c] !== 0) return { valid: false };
    if (currentKoPoint && currentKoPoint.r === r && currentKoPoint.c === c) return { valid: false };

    let testBoard = currentBoard.map(row => [...row]);
    testBoard[r][c] = color;
    let enemy = color === 1 ? 2 : 1;
    let captures = executeCapture(testBoard, enemy);
    
    if (captures.length === 0) {
        let libs = getGroupLiberties(testBoard, r, c, color, new Set());
        if (libs === 0) return { valid: false }; // 自殺禁手
    }
    
    let nextKo = null;
    if (captures.length === 1) {
        let myLibs = getGroupLiberties(testBoard, r, c, color, new Set());
        if (myLibs === 1) nextKo = captures[0]; // 打劫
    }
    return { valid: true, newBoard: testBoard, nextKo: nextKo };
}

// 判斷真眼 (禁止 AI 自行填眼)
function isEye(currentBoard, r, c, color) {
    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
    let safeEdges = 0;
    for (let d of dirs) {
        let nr = r + d[0], nc = c + d[1];
        if (nr >= 0 && nr < CONFIG.BOARD_SIZE && nc >= 0 && nc < CONFIG.BOARD_SIZE) {
            if (currentBoard[nr][nc] !== color) return false;
        } else {
            safeEdges++; // 盤邊緣算作安全
        }
    }
    return true;
}

// --- [4] 玩家互動 ---
function handleCanvasClick(e) {
    if (isGameOver || document.getElementById('game-container').style.pointerEvents === 'none') return;
    const rect = boardCanvas.getBoundingClientRect();
    const c = Math.round((e.clientX - rect.left - margin) / cellSize);
    const r = Math.round((e.clientY - rect.top - margin) / cellSize);

    if (r >= 0 && r < CONFIG.BOARD_SIZE && c >= 0 && c < CONFIG.BOARD_SIZE) {
        let moveCheck = isValidMove(board, r, c, 1, koPoint);
        if (!moveCheck.valid) { alert("此處為禁手點或打劫中！"); return; }

        board = moveCheck.newBoard;
        koPoint = moveCheck.nextKo;
        steps++; passCount = 0; 
        document.getElementById('step-count').innerText = steps;
        
        drawBoard();
        updateLiveArea();

        // 啟動 AI 腦內模擬特效
        document.getElementById('game-container').style.pointerEvents = 'none';
        let displayLv = document.getElementById('display-lv');
        displayLv.innerText = difficulty === 'hard' ? "👁️ 腦內盤算無數棋局中..." : "AI 思考中...";
        displayLv.classList.add('thinking-glow');

        // 讓瀏覽器有時間渲染文字，再進行高強度運算
        setTimeout(() => {
            npcMove();
            displayLv.innerText = diffLabels[difficulty];
            displayLv.classList.remove('thinking-glow');
            document.getElementById('game-container').style.pointerEvents = 'auto';
        }, 100);
    }
}

function playerPass() {
    if (isGameOver) return;
    steps++; passCount++; koPoint = null;
    document.getElementById('step-count').innerText = steps;
    if (passCount >= 2) { settleGameByPass(); return; }
    
    document.getElementById('game-container').style.pointerEvents = 'none';
    let displayLv = document.getElementById('display-lv');
    displayLv.innerText = "判斷局勢中...";
    setTimeout(() => {
        npcMove();
        displayLv.innerText = diffLabels[difficulty];
        document.getElementById('game-container').style.pointerEvents = 'auto';
    }, 100);
}

function settleGameByPass() {
    let finalArea = updateLiveArea();
    if (finalArea.black >= CONFIG.TARGET_BLACK) {
        endGame(true, finalArea.black, finalArea.white);
    } else {
        endGame(false, finalArea.black, finalArea.white);
    }
}

// --- [5] 蒙地卡羅樹搜索變體 (小麥覺醒神之引擎) ---
function npcMove() {
    if (isGameOver) return;
    let bestMove = null;
    
    if (difficulty === 'hard') {
        bestMove = getMonteCarloMove(board, koPoint); // 啟用神之引擎
    } else if (difficulty === 'medium') {
        bestMove = getGreedyMove(board, koPoint); // 中等：貪婪演算法
    } else {
        bestMove = getRandomMove(board, koPoint); // 簡單：隨機
    }

    if (!bestMove) { 
        passCount++;
        koPoint = null;
        if (passCount >= 2) settleGameByPass();
        return;
    }

    let moveCheck = isValidMove(board, bestMove.r, bestMove.c, 2, koPoint);
    board = moveCheck.newBoard;
    koPoint = moveCheck.nextKo;
    passCount = 0; 
    
    drawBoard();
    updateLiveArea();
}

// 🌟 黑嘉嘉/小麥級：蒙地卡羅模擬 (Monte Carlo Playouts)
function getMonteCarloMove(currentBoard, currentKo) {
    let candidates = [];
    for (let r=0; r<CONFIG.BOARD_SIZE; r++) {
        for (let c=0; c<CONFIG.BOARD_SIZE; c++) {
            if (currentBoard[r][c] === 0) {
                // 初步過濾：不填自己的真眼
                if (!isEye(currentBoard, r, c, 2)) {
                    let chk = isValidMove(currentBoard, r, c, 2, currentKo);
                    if (chk.valid) candidates.push({r, c, board: chk.newBoard, ko: chk.nextKo});
                }
            }
        }
    }
    if (candidates.length === 0) return null;

    let bestMove = null;
    let maxWinRate = -1;
    // 模擬次數：每個合法步模擬 100 局未來的棋局走向 (9x9 盤面總計可能模擬數千局)
    const SIMULATIONS_PER_MOVE = 100; 
    const MAX_DEPTH = 40; // 模擬深度 40 步

    for (let cand of candidates) {
        let wins = 0;
        for (let i = 0; i < SIMULATIONS_PER_MOVE; i++) {
            wins += simulateGame(cand.board, 1, cand.ko, MAX_DEPTH); // 換黑棋(1)走
        }
        let winRate = wins / SIMULATIONS_PER_MOVE;
        
        // 如果勝率相同，加入一點隨機性避免走死板套路
        if (winRate > maxWinRate || (winRate === maxWinRate && Math.random() > 0.5)) {
            maxWinRate = winRate;
            bestMove = cand;
        }
    }
    return bestMove;
}

// 腦內棋局模擬器
function simulateGame(startBoard, startTurn, startKo, maxDepth) {
    let simBoard = startBoard.map(row => [...row]);
    let turn = startTurn;
    let ko = startKo;
    let passes = 0;

    for (let depth = 0; depth < maxDepth; depth++) {
        // 找出快速合法點 (跳過繁重運算，直接找空位+不填眼)
        let emptySpots = [];
        for (let r=0; r<CONFIG.BOARD_SIZE; r++) {
            for (let c=0; c<CONFIG.BOARD_SIZE; c++) {
                if (simBoard[r][c] === 0 && !isEye(simBoard, r, c, turn)) emptySpots.push({r, c});
            }
        }
        
        // 隨機打亂落子順序
        emptySpots.sort(() => Math.random() - 0.5);
        let moved = false;

        for (let spot of emptySpots) {
            let chk = isValidMove(simBoard, spot.r, spot.c, turn, ko);
            if (chk.valid) {
                simBoard = chk.newBoard;
                ko = chk.nextKo;
                moved = true;
                break;
            }
        }

        if (!moved) {
            passes++;
            if (passes >= 2) break; // 雙方都沒地方下，模擬提前結束
        } else {
            passes = 0;
        }
        turn = turn === 1 ? 2 : 1; // 換對手
    }

    // 模擬結束，結算盤面！
    let finalArea = calculateArea(simBoard);
    // 站在白棋(AI)的角度，只要白棋能達到 39子 就是勝利的未來路線
    return finalArea.white >= CONFIG.TARGET_WHITE ? 1 : 0;
}

// 中級：貪婪演算法 (看當下哪一步賺最多)
function getGreedyMove(currentBoard, currentKo) {
    let bestScore = -Infinity;
    let bestSpots = [];
    for(let r=0; r<CONFIG.BOARD_SIZE; r++) {
        for(let c=0; c<CONFIG.BOARD_SIZE; c++) {
            if(currentBoard[r][c] !== 0 || isEye(currentBoard, r, c, 2)) continue;
            let check = isValidMove(currentBoard, r, c, 2, currentKo);
            if(check.valid) {
                let area = calculateArea(check.newBoard);
                let score = area.white - area.black;
                if(score > bestScore) { bestScore = score; bestSpots = [{r,c}]; }
                else if(score === bestScore) { bestSpots.push({r,c}); }
            }
        }
    }
    return bestSpots.length > 0 ? bestSpots[Math.floor(Math.random() * bestSpots.length)] : null;
}

// 初級：隨機
function getRandomMove(currentBoard, currentKo) {
    let empty = [];
    for(let r=0; r<CONFIG.BOARD_SIZE; r++)
        for(let c=0; c<CONFIG.BOARD_SIZE; c++)
            if(currentBoard[r][c] === 0) empty.push({r,c});
            
    empty.sort(() => Math.random() - 0.5);
    for(let move of empty) {
        let check = isValidMove(currentBoard, move.r, move.c, 2, currentKo);
        if(check.valid && !isEye(currentBoard, move.r, move.c, 2)) return move;
    }
    return null;
}

// --- [6] 最終結算與動畫 ---
function endGame(win, finalBlack, finalWhite) {
    isGameOver = true;
    const modal = document.getElementById('result-modal');
    const title = document.getElementById('result-title');
    const msg = document.getElementById('result-msg');

    modal.classList.remove('win-theme', 'lose-theme');

    if (win) {
        modal.classList.add('win-theme');
        title.innerHTML = "🏆 突破神之領域！";
        msg.innerHTML = `雙方停戰結算。<br>你以 <b>${finalBlack}</b> 目力壓群雄，戰勝了小麥的無盡算力！`;
        
        const limit = (difficulty === 'hard') ? 6 : 3;
        const myList = topScores[difficulty];
        const isTop = myList.length < limit || steps < myList[myList.length - 1].steps;
        if (isTop) {
            setTimeout(() => {
                const name = prompt(`🎉 新紀錄！請輸入大名登錄榜單：`) || "圍棋之神";
                db.ref(paths[difficulty]).push({ name, steps, time: Date.now() });
            }, 800);
        }
    } else {
        document.body.classList.add('miserable-mode');
        modal.classList.add('lose-theme');
        title.innerHTML = "💀 算力碾壓...";
        msg.innerHTML = `雙方停戰結算。<br>你的 <b>${finalBlack}</b> 目無法抗衡 AI 預測的未來（AI 佔據 ${finalWhite} 目）。`;
    }
    
    setTimeout(() => { modal.classList.add('show'); }, 100);
}

function animationLoop() {
    frameCount++;
    if (isGameOver) {
        victoryCtx.clearRect(0, 0, victoryCanvas.width, victoryCanvas.height);
        for(let i=0; i<30; i++) {
            victoryCtx.fillStyle = i % 2 === 0 ? 'gold' : 'rgba(255,255,255,0.8)';
            victoryCtx.beginPath();
            let speed = isGameOver && document.body.classList.contains('miserable-mode') ? 0.5 : 2;
            let x = (frameCount * speed + i * 80) % victoryCanvas.width;
            let y = victoryCanvas.height - (frameCount * (speed * 0.8) + i * 70) % victoryCanvas.height; 
            let radius = (Math.sin(i) * 5 + 5); 
            victoryCtx.arc(x, y, radius, 0, Math.PI * 2); 
            victoryCtx.fill();
        }
    }
    requestAnimationFrame(animationLoop);
}
